name: Publish image

on:
  push:
    branches: [dev, prod]
  # Para volver a publicar a mano (pestaña Actions) la imagen de una rama
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Check
        run: nix develop --command ./gradlew check

      - name: Image name
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/snippet-service" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: <rama> (lo que despliega el stack) y <rama>-<sha> (para volver atrás)
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}-${{ steps.meta.outputs.sha }}

      # Despliega la imagen nueva: el workflow Deploy de snippet-searcher-infra corre el stack de
      # esta rama en su VM. DEPLOY_PAT: token clásico con el scope repo (ver ese repo)
      - name: Deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PAT }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY_OWNER}/snippet-searcher-infra/dispatches" \
            -f event_type=deploy -f "client_payload[environment]=${GITHUB_REF_NAME}"
