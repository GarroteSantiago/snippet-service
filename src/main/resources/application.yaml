spring:
  application:
    name: snippet-service
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Auth0: https://<tenant>.auth0.com/ (con la barra final)
          issuer-uri: ${AUTH0_ISSUER_URI}
          audiences: ${AUTH0_AUDIENCE}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/snippet}
    username: ${DB_USER:snippet}
    password: ${DB_PASSWORD:snippet}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  http:
    client:
      # Applies to every RestClient built from Spring's builder (the clients of services.*)
      connect-timeout: 2s
      read-timeout: 10s

server:
  port: ${PORT:8080}
  shutdown: graceful

logging:
  # json (one object per line, what New Relic ingests) or plain (readable, for local dev): logback-spring.xml
  console-format: ${LOG_FORMAT:json}
  structured:
    json:
      add:
        service: ${spring.application.name}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}
    distribution:
      # Latency: histograms, so percentiles can be aggregated across replicas
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
  # Micrometer metrics to New Relic over OTLP; off until there is a license key
  otlp:
    metrics:
      export:
        enabled: ${NEW_RELIC_ENABLED:false}
        url: ${NEW_RELIC_OTLP_URL:https://otlp.nr-data.net/v1/metrics}
        headers:
          api-key: ${NEW_RELIC_LICENSE_KEY:}
        # New Relic prefers delta over cumulative
        aggregation-temporality: delta
        step: 60s

observability:
  # Internal port where /prometheus answers without a token (NGINX doesn't proxy it); 0 turns it off
  metrics-port: ${METRICS_PORT:9464}
  # How often the gauges of the streams (length, lag, pending) ask Redis
  stream-metrics-interval: 15s

# Servicios que orquesta (ver contracts/)
services:
  permission:
    url: ${PERMISSION_SERVICE_URL:http://localhost:8081}
  runner:
    url: ${RUNNER_URL:http://localhost:8082}
  asset:
    url: ${ASSET_SERVICE_URL:http://localhost:8083}

# Extension of each language the Runner reports (the Runner doesn't say it)
languages:
  extensions:
    printscript: ps

# Productor de snippet:jobs y consumidor de snippet:results (contracts/redis-streams.md)
streams:
  # Apaga el consumidor y el chequeo de parserVersion (se sigue publicando)
  enabled: true
  # Vacío: el hostname del contenedor, así cada réplica es un consumidor distinto
  consumer-name: ${STREAMS_CONSUMER_NAME:}
  max-length: 10000
  batch-size: 10
  block: 2s
  reclaim-interval: 30s
  min-idle: 60s
  max-deliveries: 3

# US-18: cada cuánto se pregunta el parserVersion al Runner (también al arrancar)
parser-version:
  check-interval: 5m

# Auth0 Management API, to search users and check they exist when sharing (US-07).
# Machine-to-machine app with the `read:users` permission. Without these values the
# service starts anyway; only `GET /users` and sharing fail (502).
auth0:
  management:
    domain: ${AUTH0_DOMAIN:}
    client-id: ${AUTH0_M2M_CLIENT_ID:}
    client-secret: ${AUTH0_M2M_CLIENT_SECRET:}
  # Client Credentials of the service itself, for the calls without a user (the consumer of
  # snippet:results, the parserVersion check): contracts/README.md, "Llamadas sin usuario".
  # Without the client id and secret the service starts anyway, but the Runner rejects those calls (401).
  service:
    token-uri: ${AUTH0_TOKEN_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}oauth/token}
    client-id: ${AUTH0_SERVICE_CLIENT_ID:}
    client-secret: ${AUTH0_SERVICE_CLIENT_SECRET:}
    audience: ${spring.security.oauth2.resourceserver.jwt.audiences}

# Ejecución interactiva por WebSocket (/ws/snippets/{id}/run, contracts/websocket.md)
snippet-run:
  # Tiempo para mandar el start con el token antes de cerrar con 4401
  start-timeout: 5s
  # Orígenes que pueden abrir el socket (el token va en el primer mensaje, no en cookies)
  allowed-origins: ${WS_ALLOWED_ORIGINS:*}
